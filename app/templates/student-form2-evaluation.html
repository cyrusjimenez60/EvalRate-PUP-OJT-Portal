<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EvalRate</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/student-form2-evaluation.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="icon" href="{{ url_for('static', filename='images/EvalRate-Logo.png') }}">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    
    
<div class="page-container">
  
    <div class="sidebar">

        <div class="profile-section">
            <div class="profile-pic">
                <img src="{{ url_for('static', filename='images/profile.jpg') }}" alt="profile">
            </div>
            <div class="profile-details">
                <p id="profile-name">Jhon Denard Firme</p>
                <p id="profile-company">Unilab Pharmaceuticals</p>
            </div>

            <div class="menu-btn">
                <i class="ph-bold ph-caret-left"></i>
            </div>
        </div>


        <div class="dashboard-section" >

            <a href="{{ url_for('student.student_dashboard') }}">
            <div class="dashboard-cell">
                <div class="dashboard">
                    <i class="ph-bold ph-house-simple"></i>
                    <p class="text">Dashboard</p>
                </div>
            </div>
            </a>


            <a href="#">
                <div class="dashboard-cell active">
                    <div class="forms">
                        <i class="ph-bold ph-file-text"></i>
                        <p class="text">Evaluation Forms</p>
                        <i class="caret ph ph-caret-down"></i>
                    </div>
                </div>
            </a>



            <div class="dashboard-submenu">
                <a href="{{ url_for('student.student_evaluationForm1') }}">
                    <div class="submenu-cell">
                        <div class="form-1">
                            <i class="ph-bold ph-file-text"></i>
                            <p class="text">Form 1</p>
                        </div>
                    </div>
                </a>

                <a href="{{ url_for('student.student_evaluationForm2') }}">
                    <div class="submenu-cell">
                        <div class="form-1 active">
                            <i class="ph-bold ph-file-text"></i>
                            <p class="text">Form 2</p>
                        </div>
                    </div>
                </a>

                <a href="{{ url_for('student.student_evaluationForm3') }}">
                    <div class="submenu-cell">
                        <div class="form-1">
                            <i class="ph-bold ph-file-text"></i>
                            <p class="text">Form 3</p>
                        </div>
                    </div>
                </a>
        </div>


            








        </div>

        <div class="settings-section">

            <div class="dashboard-cell">
                <div class="settings">
                    <i class="ph-bold ph-gear-six"></i>
                    <p class="text">Settings</p>
                </div>
            </div>
        </div>


    </div>










    <div class="main-page">

        <div class="evaluate-button">
            <p class="button-text">Evaluate Now</p>

        </div>


        <div class="form-details-section">
            <p class="form-title">Form 2</p>
            <p class="form-desc">Supervisor to Intern Evaluation Form</p>
        </div>

    </div>        
  


</div>


</body>
</html>
